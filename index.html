<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>문재원 | Developer Portfolio</title>

<!-- 폰트 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@400;600;800&display=swap">

<!-- 스타일 -->
<link rel="stylesheet" href="css/base.css">        <!-- 색상, 폰트, 공통 / 상단메뉴, Hero, About, 경력, 연락처 -->
<link rel="stylesheet" href="css/background.css">  <!-- IDE 코드 배경 -->
<link rel="stylesheet" href="css/projects.css">    <!-- 프로젝트 카드, 상세 내용 -->
<link rel="stylesheet" href="css/lightbox.css">    <!-- 스크린샷 크게 보기 -->
</head>
<body>

<!-- 배경: 흐르는 코드 (내용은 js/data/background-code.js) -->
<div class="code-bg" aria-hidden="true"><div class="code-scroll" id="codeScroll"></div></div>

<nav class="nav">
  <div class="wrap nav-inner">
    <a class="logo" href="#top">&lt;JW<b>/</b>&gt;</a>
    <ul class="nav-links">
      <li><a href="#about">about</a></li>
      <li><a href="#experience">experience</a></li>
      <li><a href="#projects">projects</a></li>
      <li><a href="#apps">apps</a></li>
      <li><a href="#contact">contact</a></li>
    </ul>
  </div>
</nav>

<main class="page" id="top">
  <!-- HERO -->
  <header class="wrap hero">
    <div class="hero-inner">
      <div class="hero-text">
        <div class="prompt"><span><span class="u">jaewon@portfolio</span>:<span class="p">~</span>$</span> <span><span id="typed"></span><span class="caret"></span></span></div>
        <h1 class="hero-name">안녕하세요,<br><span id="heroName"></span>입니다.</h1>
        <p class="hero-sub" id="heroIntro"></p>
        <div class="btns">
          <a class="btn btn-primary" href="#projects">프로젝트 보기 →</a>
          <a class="btn btn-outline" href="#contact">연락하기</a>
        </div>
      </div>
      <div class="photo"><img id="heroPhoto" alt="프로필 사진"></div>
    </div>
  </header>

  <!-- ABOUT -->
  <section class="wrap" id="about">
    <p class="label">about_me</p>
    <h2>About Me</h2>
    <div class="grid2">
      <div class="card info"><h3>cat profile.json</h3><div id="infoRows"></div></div>
      <div class="card info"><h3>git status</h3><div id="statusRows"></div></div>
    </div>
  </section>

  <!-- EXPERIENCE -->
  <section class="wrap" id="experience">
    <p class="label">experience</p>
    <h2>경력 사항</h2>
    <div class="exp-list" id="expList"></div>
  </section>

  <!-- PROJECTS (내용은 js/data/projects.js) -->
  <section class="wrap" id="projects">
    <p class="label">projects</p>
    <h2>프로젝트</h2>
    <div class="proj-grid" id="projectCards"></div>
    <div class="detail-list" id="projectDetails"></div>
  </section>

  <!-- APPS (내용은 js/data/apps.js) -->
  <section class="wrap" id="apps">
    <p class="label">apps</p>
    <h2>앱 개발</h2>
    <div class="proj-grid" id="appCards"></div>
    <div class="detail-list" id="appDetails"></div>
  </section>

  <!-- CONTACT -->
  <section class="wrap" id="contact">
    <p class="label">contact</p>
    <h2>Contact</h2>
    <div class="card contact-box" id="contactBox"></div>
  </section>
</main>

<footer class="footer">© 2026 문재원 · All rights reserved</footer>

<!-- 스크린샷 크게 보기 (js/lightbox.js) -->
<div class="lightbox" id="lightbox" hidden role="dialog" aria-modal="true" aria-label="스크린샷 크게 보기">
  <button class="lb-close" type="button" aria-label="닫기">✕</button>
  <button class="lb-nav lb-prev" type="button" aria-label="이전 화면">‹</button>
  <figure class="lb-stage">
    <img class="lb-img" alt="">
    <figcaption class="lb-caption"><span class="lb-title"></span><span class="lb-count"></span></figcaption>
  </figure>
  <button class="lb-nav lb-next" type="button" aria-label="다음 화면">›</button>
</div>

<!-- ① 내용 데이터 (수정은 대부분 여기서) -->
<script src="js/data/profile.js"></script>
<script src="js/data/experience.js"></script>
<script src="js/data/projects.js"></script>
<script src="js/data/apps.js"></script>
<script src="js/data/background-code.js"></script>
<!-- ② 화면 동작 -->
<script src="js/background.js"></script>
<script src="js/render.js"></script>
<script src="js/lightbox.js"></script>
<script src="js/main.js"></script>
</body>
</html>
